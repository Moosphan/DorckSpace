name: Feature Request
description: Suggest a new feature or improvement for MyDashboard
title: "[feat]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea clearly so we can evaluate and prioritize it.

        **Before submitting**, please:
        - Search [existing issues](https://github.com/Moosphan/MyDashboard/issues) to avoid duplicates
        - Check if the feature already exists or is planned

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/Moosphan/MyDashboard/issues) and this has not been requested before
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What problem does this feature solve? Why is it needed?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, mockups, or references here.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Related Area
      description: Which part of the app does this relate to?
      options:
        - Dashboard
        - Writing Studio
        - Video Studio
        - Insights (RSS / Social)
        - AI Lab
        - Settings
        - Editor
        - Sidebar / Navigation
        - Design System
        - Other
    validations:
      required: false
