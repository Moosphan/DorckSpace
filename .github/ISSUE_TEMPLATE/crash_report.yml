name: Crash Report
description: Report an application crash, white screen, or unresponsive state
title: "[crash]: "
labels: ["bug", "crash"]

body:
  - type: markdown
    attributes:
      value: |
        Sorry to hear the app crashed! Please provide as much detail as possible so we can diagnose the issue.

        **Tip:** If you can reproduce the crash, try to capture the error message or stack trace from:
        - **macOS**: Console.app or `~/Library/Logs/MyDashboard/`
        - **Windows**: Event Viewer or `%APPDATA%/MyDashboard/logs/`
        - **Linux**: `~/.config/MyDashboard/logs/` or terminal output

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/Moosphan/MyDashboard/issues) and this has not been reported before
          required: true
        - label: I am using the latest version of MyDashboard
          required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What were you doing when the crash occurred?
      description: Describe the actions leading up to the crash.
      placeholder: |
        1. Opened the Writing Studio
        2. Clicked on an article
        3. Tried to insert an image
        4. App became unresponsive / crashed
    validations:
      required: true

  - type: textarea
    id: error-info
    attributes:
      label: Error Message / Stack Trace
      description: Paste any error messages, stack traces, or crash dumps.
      render: bash
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information (e.g., does it happen every time? Only on certain articles?).
    validations:
      required: false
