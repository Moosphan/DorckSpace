appId: com.dorck.dashboard
productName: DorckDashboard
copyright: Copyright © 2024-2026 Dorck
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
asar: true
extraMetadata:
  main: out/main/index.js
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
